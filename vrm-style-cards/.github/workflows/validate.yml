name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and check syntax
        run: |
          ./build.sh
          node --check dist/vrm-style-cards.js
          git diff --exit-code dist/ || (echo "dist/ is not up to date – run ./build.sh and commit" && exit 1)
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
